<!DOCTYPE html>
<html>
<head>
  <title>GET ESPORTS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(180deg,#0f172a,#020617);
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    .logo {
      width: 110px;
      border-radius: 20px;
      box-shadow: 0 0 30px #3b82f6;
    }

    h1 {
      margin-top: 15px;
      font-size: 28px;
    }

    p {
      color: #94a3b8;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #3b82f6;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 20px #3b82f6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 15px;
      margin-top: 40px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <img src="https://i.ibb.co.com/bgZc18y6/IMG-2026042.jpg" class="logo">

  <h1>🎮 GET ESPORTS</h1>
  <p>Play • Compete • Earn Rewards</p>

  <a class="btn" href="https://github.com/deepbarmon2026-sys/getesports-app/raw/main/getesports.apk">
    📥 Download App
  </a>

  <div class="cards">
    <div class="card">
      <h3>30K+</h3>
      <p class="small">Downloads</p>
    </div>

    <div class="card">
      <h3>10K+</h3>
      <p class="small">Players</p>
    </div>

    <div class="card">
      <h3>24/7</h3>
      <p class="small">Support</p>
    </div>

    <div class="card">
      <h3>Secure</h3>
      <p class="small">Fast Payment</p>
    </div>
  </div>

</div>

</body>
</html>
